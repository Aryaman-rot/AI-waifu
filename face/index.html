<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>face</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #subtitle {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        width: min(92%, 400px);
        box-sizing: border-box;
        padding: 6px 10px;
        text-align: center;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 500;
        color: #ffffff;
        background: transparent;
        text-wrap: balance;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.95),
          0 0 6px rgba(0, 0, 0, 0.85),
          1px 1px 2px rgba(0, 0, 0, 0.9),
          -1px -1px 2px rgba(0, 0, 0, 0.9),
          1px -1px 2px rgba(0, 0, 0, 0.9),
          -1px 1px 2px rgba(0, 0, 0, 0.9);
        opacity: 0;
        transition: opacity 140ms ease-out;
        pointer-events: none;
      }
      #subtitle.visible {
        opacity: 1;
      }
      #drag-layer {
        position: fixed;
        inset: 0;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="subtitle"></div>
    <div id="drag-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
